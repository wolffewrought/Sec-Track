name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gather the app files
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          cp favicon.ico www/ 2>/dev/null || true
          test -f www/index.html || { echo "index.html not found at the repo root"; exit 1; }
          ls -la www

      - name: Install tooling
        run: npm install

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Brand the launcher icon
        run: |
          if ! command -v convert >/dev/null 2>&1 && ! command -v magick >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi
          CONVERT=$(command -v convert || command -v magick)
          SRC=icon-maskable-512.png
          [ -f "$SRC" ] || SRC=icon-512.png
          echo "using $SRC"
          RES=android/app/src/main/res
          rm -rf "$RES"/mipmap-anydpi-v26
          for PAIR in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            NAME=${PAIR%%:*}; SIZE=${PAIR##*:}
            mkdir -p "$RES/mipmap-$NAME"
            "$CONVERT" "$SRC" -resize ${SIZE}x${SIZE} "$RES/mipmap-$NAME/ic_launcher.png"
            cp "$RES/mipmap-$NAME/ic_launcher.png" "$RES/mipmap-$NAME/ic_launcher_round.png"
          done
          ls -la "$RES"/mipmap-xxxhdpi

      - name: Set the version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build the unsigned release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign it
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          TOOLS=$(ls -d "
