name: Build Android APK

# Run it by hand from the Actions tab - nothing happens on a push.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The app files live at the repo root so GitHub Pages keeps working.
      # Capacitor wants them together in one folder, so gather them here.
      - name: Gather the app files
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          cp favicon.ico www/ 2>/dev/null || true
          test -f www/index.html || { echo "index.html not found at the repo root"; exit 1; }
          ls -la www

      - name: Install tooling
        run: |
          npm install
          # The one line this wrapper was missing: without the Filesystem
          # plugin a Capacitor WebView has no way to save a file at all,
          # so every export died at a silently ignored download link.
          # Pinned to the 7 line, because the project pins Capacitor 7 -
          # the bare install fetched v8 and npm rightly refused the pair.
          npm install @capacitor/filesystem@^7

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      # Capacitor scaffolds its own placeholder launcher icon, so replace it
      # with the app's. The maskable artwork is used because Android crops
      # launcher icons to the device's shape.
      # Copies the app icon into the Android launcher slots. No image
      # tooling needed - Android scales the one file for each density.
      - name: Brand the launcher icon
        run: |
          set -e
          RES=android/app/src/main/res
          SRC=icon-maskable-512.png
          if [ ! -f "$SRC" ]; then SRC=icon-512.png; fi
          if [ ! -f "$SRC" ]; then echo "no icon at the repo root"; ls -la; exit 1; fi
          echo "using $SRC"
          rm -rf "$RES/mipmap-anydpi-v26"
          for NAME in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$NAME"
            cp "$SRC" "$RES/mipmap-$NAME/ic_launcher.png"
            cp "$SRC" "$RES/mipmap-$NAME/ic_launcher_round.png"
          done
          find "$RES" -name "ic_launcher*" | sort

      # Android refuses an update whose version has not gone up, so tie it
      # to the run number - that only ever increases.
      # Android backs app data up to the user's Google Drive by default.
      # For a log meant never to leave the site, that is an exfiltration
      # path nobody asked for. FLAG_SECURE also keeps the records out of
      # screenshots and out of the app switcher preview.
      - name: Close the leaks
        run: |
          set -e
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$MAN"
          grep -q 'android:allowBackup' "$MAN" || sed -i 's/<application /<application android:allowBackup="false" /' "$MAN"
          sed -i 's/ android:fullBackupContent="[^"]*"//' "$MAN"
          sed -i 's/ android:dataExtractionRules="[^"]*"//' "$MAN"
          echo "backup setting now:"
          grep -o 'android:allowBackup="[a-z]*"' "$MAN"

          DIR=android/app/src/main/java/shop/wolffewrought/accesstracker
          mkdir -p "$DIR"
          printf '%s\n' \
            'package shop.wolffewrought.accesstracker;' \
            '' \
            'import android.os.Bundle;' \
            'import com.getcapacitor.BridgeActivity;' \
            '' \
            'public class MainActivity extends BridgeActivity {' \
            '    @Override' \
            '    public void onCreate(Bundle savedInstanceState) {' \
            '        super.onCreate(savedInstanceState);' \
            '        /* FLAG_SECURE removed by request: screenshots allowed. */' \
            '    }' \
            '}' \
            > "$DIR/MainActivity.java"
          cat "$DIR/MainActivity.java"

      - name: Set the version
        run: |
          set -e
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build the unsigned release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # The secrets come in as environment variables rather than being
      # pasted into the script, and every command sits on one line, so
      # there are no continuations to lose.
      - name: Sign it
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ]; then echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          printf '%s' "$KS_B64" | tr -d '\n\r' | base64 -d > keystore.jks
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "using $TOOLS"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$TOOLS/apksigner" sign --ks keystore.jks --ks-key-alias access-tracker --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out access-tracker.apk aligned.apk
          "$TOOLS/apksigner" verify --print-certs access-tracker.apk
          rm -f keystore.jks aligned.apk

      - uses: actions/upload-artifact@v5
        with:
          name: access-tracker-apk
          path: access-tracker.apk
          if-no-files-found: error
