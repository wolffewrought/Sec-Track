name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gather the app files
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          cp favicon.ico www/ 2>/dev/null || true
          test -f www/index.html || { echo "index.html not found at the repo root"; exit 1; }
          ls -la www

      - name: Install tooling
        run: npm install

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set the version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build the unsigned release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign it
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "using $TOOLS"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$TOOLS/apksigner" sign \
            --ks keystore.jks \
            --ks-key-alias access-tracker \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out access-tracker.apk aligned.apk
          "$TOOLS/apksigner" verify --print-certs access-tracker.apk
          rm -f keystore.jks aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: access-tracker-apk
          path: access-tracker.apk
          if-no-files-found: error
